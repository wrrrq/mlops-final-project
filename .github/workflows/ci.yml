name: HeartGuard CI/CD

on:
  pull_request:
    branches: [ "main", "staging", "dev" ]
  push:
    branches: [ "main", "staging" ]

jobs:
  # 阶段 1：CI 检查（任何 PR 触发）
  ci-checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt ruff pytest black
      
      - name: Format Check with Black
        run: black --check .

      - name: Lint with Ruff  # 代码规范检查
        run: ruff check .

      - name: Test with pytest  # 跑同学A写的测试
        run: pytest tests/

      - name: Build Docker Image  # 验证 Docker 能不能构建成功
        run: docker build -t heartguard:test .

  # 阶段 2：CD 构建 Staging（合并到 staging 触发）
  cd-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    # 告诉 GitHub 去 staging 房间拿密码
    environment: staging 
    steps:
      - uses: actions/checkout@v4

      - name: Inject Staging Env
        #密码的名字叫 ENV_FILE
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Build Staging Image
        run: docker build -t heartguard:staging .

  # 阶段 3：CD 构建 Production（合并到 main 触发）
  cd-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 告诉 GitHub 去 production 房间拿密码
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Inject Prod Env
        # 👇 密码的名字同样叫 ENV_FILE
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: Build Prod Image
        run: docker build -t heartguard:prod .